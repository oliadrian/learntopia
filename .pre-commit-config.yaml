minimum_pre_commit_version: "4.4.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: unsupported
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: unsupported
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: unsupported
        types: [python]
        pass_filenames: false